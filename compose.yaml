services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pizzburg_bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d pizzburg_bridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      BRIDGE_DATABASE_URL: postgresql+asyncpg://bridge:bridge@db:5432/pizzburg_bridge
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
